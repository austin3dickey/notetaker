name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build & test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debug
            gradle-tasks: lintDebug testDebugUnitTest assembleDebug
          - variant: release
            gradle-tasks: testReleaseUnitTest assembleRelease
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287  # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92  # v6.2.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Debug variant runs lint + unit tests + assemble; release variant runs unit
      # tests + assemble (exercises R8 and resource shrinking). testBuildType must
      # match the test task — AGP only generates the unit-test task for one
      # variant at a time.
      - name: Build & test
        env:
          GRADLE_TASKS: ${{ matrix.gradle-tasks }}
          BUILD_TYPE: ${{ matrix.variant }}
        run: |
          read -ra tasks <<< "$GRADLE_TASKS"
          ./gradlew "${tasks[@]}" -PtestBuildType="$BUILD_TYPE" --no-daemon

  # Aggregator — branch protection requires this single check, so matrix shape
  # can change freely without touching protection rules.
  ci-status:
    name: build & test
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify matrix succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "build matrix did not succeed: $BUILD_RESULT"
            exit 1
          fi
